<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Pro Manager</title>
    <style>
        :root {
            --primary: #818cf8;
            --primary-dark: #6366f1;
            --accent: #f43f5e;
            --success: #34d399;
            --bg-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
            --bg-color: #0b0f19;
            --card-bg: #131c31;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        body { 
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg-color); 
            margin: 0; 
            padding: 15px; 
            color: var(--text-main); 
        }

        .app-header {
            background: var(--bg-gradient);
            color: white;
            padding: 22px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.3);
        }

        .app-header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .app-header p {
            margin: 5px 0 0 0;
            font-size: 13px;
            opacity: 0.9;
        }

        /* Nav Tabs */
        .nav-tabs {
            display: flex;
            background: #131c31;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 20px;
            gap: 4px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #0b0f19;
            box-shadow: 0 4px 12px rgba(129, 140, 248, 0.3);
            font-weight: 700;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .container { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5); 
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        h2 { 
            color: var(--primary); 
            font-size: 18px; 
            margin-top: 0; 
            margin-bottom: 16px; 
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group { 
            margin-bottom: 14px; 
        }

        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: 700; 
            font-size: 12px; 
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid var(--border); 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 14px; 
            transition: all 0.2s;
            background: #0b0f19;
            color: var(--text-main);
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.15);
        }

        button { 
            width: 100%; 
            background: var(--bg-gradient); 
            color: white; 
            border: none; 
            padding: 14px; 
            font-size: 15px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 700; 
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-add { background: linear-gradient(135deg, #059669 0%, #34d399 100%); color: #0b0f19; box-shadow: 0 4px 15px rgba(52, 211, 153, 0.2); margin-top: 10px; }
        .btn-danger { background: #ef4444; color: white; width: auto; padding: 6px 12px; font-size: 12px; border-radius: 6px; box-shadow: none; }
        .btn-print { background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%); color: #0b0f19; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2); margin-top: 15px; }

        .success-msg { 
            color: var(--success); 
            text-align: center; 
            margin-top: 10px; 
            font-weight: 700; 
            font-size: 13px;
        }
        
        .search-box { 
            display: flex; 
            gap: 8px; 
        }
        .search-box input { flex: 1; }
        .search-box button { width: auto; padding: 0 20px; }
        
        .result-card { 
            margin-top: 15px; 
            padding: 15px; 
            border: 2px dashed var(--border); 
            border-radius: 12px; 
            background: #0b0f19; 
            display: none; 
            text-align: center; 
        }
        .result-card img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 8px; 
            max-height: 180px; 
            object-fit: contain; 
            margin-bottom: 10px; 
        }
        .product-details { text-align: left; margin-bottom: 12px; font-size: 14px; line-height: 1.5; color: var(--text-muted); }
        .product-details strong { color: var(--text-main); }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
            font-size: 13px; 
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #1a243f; color: var(--text-muted); font-size: 11px; text-transform: uppercase; }
        .cart-img { width: 38px; height: 38px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
        
        .total-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding: 15px;
            background: #0b0f19;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            color: var(--success);
            border: 1px solid var(--border);
        }

        @media print {
            body { background: white; color: black; padding: 0; }
            .no-print { display: none !important; }
            .container { background: white; color: black; box-shadow: none; border: none; margin: 0; padding: 0; }
            table { border: 1px solid #000; color: black; }
            th, td { border: 1px solid #000; color: black; }
            th { background: #eee !important; color: #000; }
            .total-box { background: white; color: black; border: 1px solid #000; }
        }
    </style>
</head>
<body>

<div class="app-header no-print">
    <h1>🚀 Business Pro Manager</h1>
    <p>Dark Mode Inventory & Quotation System</p>
</div>

<!-- Navigation Tabs -->
<div class="nav-tabs no-print">
    <button class="tab-btn active" onclick="switchTab('entry')">➕ Add Product</button>
    <button class="tab-btn" onclick="switchTab('search')">🔍 Search & Add</button>
    <button class="tab-btn" onclick="switchTab('quotation')">📄 Quotation</button>
</div>

<!-- Tab 1: Product Entry -->
<div id="tab-entry" class="tab-content active no-print">
    <div class="container">
        <h2>📦 New Product Entry</h2>
        <form id="productForm">
            <div class="form-group">
                <label>Item Number (Unique ID)</label>
                <input type="text" id="itemNumber" required placeholder="e.g. ITM-001">
            </div>
            <div class="form-group">
                <label>Product Photo</label>
                <input type="file" id="productPhoto" accept="image/*" required>
            </div>
            <div class="form-group">
                <label>Description / Name</label>
                <textarea id="productDesc" rows="2" required placeholder="Enter product details..."></textarea>
            </div>
            <div class="form-group">
                <label>Size</label>
                <input type="text" id="productSize" required placeholder="e.g. Medium / 30x30">
            </div>
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" id="productPrice" required placeholder="0.00">
            </div>
            <button type="submit">Save Product</button>
        </form>
        <div id="msg" class="success-msg"></div>
    </div>
</div>

<!-- Tab 2: Search -->
<div id="tab-search" class="tab-content no-print">
    <div class="container">
        <h2>🔍 Search Inventory</h2>
        <div class="form-group search-box" style="margin-bottom:0;">
            <input type="text" id="searchItemNo" placeholder="Enter Item Number...">
            <button type="button" onclick="searchProduct()">Find</button>
        </div>
        
        <div id="searchResult" class="result-card">
            <img id="resPhoto" src="" alt="Photo">
            <div class="product-details">
                <p><strong>Item No:</strong> <span id="resItemNo"></span></p>
                <p><strong>Desc:</strong> <span id="resDesc"></span></p>
                <p><strong>Size:</strong> <span id="resSize"></span></p>
                <p><strong>Price:</strong> ₹<span id="resPrice"></span></p>
            </div>
            <button class="btn-add" onclick="addToQuotation()">+ Add to Quotation</button>
        </div>
    </div>
</div>

<!-- Tab 3: Quotation Sheet -->
<div id="tab-quotation" class="tab-content active-print">
    <div class="container" id="printArea">
        <h2>📄 Quotation Summary</h2>
        <table>
            <thead>
                <tr>
                    <th>Photo</th>
                    <th>Item</th>
                    <th>Desc</th>
                    <th>Size</th>
                    <th>Price</th>
                    <th class="no-print">Action</th>
                </tr>
            </thead>
            <tbody id="cartBody">
                <tr>
                    <td colspan="6" style="text-align:center; color:var(--text-muted); padding: 25px;">No products added yet.</td>
                </tr>
            </tbody>
        </table>
        
        <div class="total-box">
            <span>Total Amount:</span>
            <span>₹<span id="totalPrice">0</span></span>
        </div>

        <button class="btn-print no-print" onclick="window.print()">🖨️ Print / Save PDF</button>
    </div>
</div>

<script>
    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        if(tabName === 'entry') {
            document.getElementById('tab-entry').classList.add('active');
            event.currentTarget.classList.add('active');
        } else if(tabName === 'search') {
            document.getElementById('tab-search').classList.add('active');
            event.currentTarget.classList.add('active');
        } else if(tabName === 'quotation') {
            document.getElementById('tab-quotation').classList.add('active');
            event.currentTarget.classList.add('active');
        }
    }

    let currentSearchedProduct = null;
    let quotationCart = [];

    document.getElementById('productForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const itemNumber = document.getElementById('itemNumber').value.trim();
        const photoInput = document.getElementById('productPhoto');
        const productDesc = document.getElementById('productDesc').value;
        const productSize = document.getElementById('productSize').value;
        const productPrice = document.getElementById('productPrice').value;

        if (photoInput.files && photoInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    let width = img.width, height = img.height;
                    const max_size = 500;
                    if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } }
                    else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                    const productData = { itemNumber, photo: compressedBase64, description: productDesc, size: productSize, price: productPrice };
                    let products = JSON.parse(localStorage.getItem('businessProducts')) || [];
                    let existingIndex = products.findIndex(p => p.itemNumber.toLowerCase() === itemNumber.toLowerCase());
                    
                    if(existingIndex > -1) products[existingIndex] = productData;
                    else products.push(productData);

                    localStorage.setItem('businessProducts', JSON.stringify(products));
                    document.getElementById('msg').innerText = "✨ Product Successfully Saved!";
                    document.getElementById('productForm').reset();
                    setTimeout(() => { document.getElementById('msg').innerText = ""; }, 3000);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(photoInput.files[0]);
        }
    });

    function searchProduct() {
        const query = document.getElementById('searchItemNo').value.trim();
        const resultDiv = document.getElementById('searchResult');
        if(!query) { alert("Please enter an Item Number!"); return; }

        let products = JSON.parse(localStorage.getItem('businessProducts')) || [];
        const found = products.find(p => p.itemNumber.toLowerCase() === query.toLowerCase());

        if(found) {
            currentSearchedProduct = found;
            resultDiv.style.display = "block";
            document.getElementById('resPhoto').src = found.photo;
            document.getElementById('resItemNo').innerText = found.itemNumber;
            document.getElementById('resDesc').innerText = found.description;
            document.getElementById('resSize').innerText = found.size;
            document.getElementById('resPrice').innerText = found.price;
        } else {
            resultDiv.style.display = "none";
            currentSearchedProduct = null;
            alert("Item Number not found!");
        }
    }

    function addToQuotation() {
        if(!currentSearchedProduct) return;
        quotationCart.push(currentSearchedProduct);
        renderCart();
        alert("✔️ Added to Quotation list!");
    }

    function renderCart() {
        const tbody = document.getElementById('cartBody');
        tbody.innerHTML = "";
        if(quotationCart.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-muted); padding: 25px;">No products added yet.</td></tr>`;
            document.getElementById('totalPrice').innerText = "0";
            return;
        }

        let total = 0;
        quotationCart.forEach((item, index) => {
            total += Number(item.price);
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><img src="${item.photo}" class="cart-img"></td>
                <td><strong>${item.itemNumber}</strong></td>
                <td>${item.description}</td>
                <td>${item.size}</td>
                <td>₹${item.price}</td>
                <td class="no-print"><button class="btn-danger" onclick="removeFromCart(${index})">X</button></td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById('totalPrice').innerText = total;
    }

    function removeFromCart(index) {
        quotationCart.splice(index, 1);
        renderCart();
    }
</script>

</body>
</html>
