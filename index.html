<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Product & Quotation Manager</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            color: var(--text-main); 
        }

        .container { 
            max-width: 650px; 
            margin: 0 auto 20px auto; 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.03); 
            border: 1px solid var(--border-color);
        }

        h2 { 
            color: var(--primary); 
            font-size: 20px; 
            margin-top: 0; 
            margin-bottom: 20px; 
            padding-bottom: 10px;
            border-bottom: 2px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group { 
            margin-bottom: 16px; 
        }

        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 600; 
            font-size: 13px; 
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1.5px solid var(--border-color); 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 14px; 
            transition: all 0.2s ease;
            background: #fff;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button { 
            width: 100%; 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 14px; 
            font-size: 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: background 0.2s ease, transform 0.1s active;
        }

        button:hover { 
            background: var(--primary-hover); 
        }

        button:active {
            transform: scale(0.99);
        }

        .btn-add { 
            background: var(--success); 
            margin-top: 12px; 
        }
        .btn-add:hover { 
            background: var(--success-hover); 
        }

        .btn-danger { 
            background: var(--danger); 
            width: auto; 
            padding: 6px 12px; 
            font-size: 12px; 
            border-radius: 6px;
        }

        .btn-print { 
            background: #0ea5e9; 
            margin-top: 20px; 
            font-size: 16px; 
        }
        .btn-print:hover {
            background: #0284c7;
        }

        .success-msg { 
            color: var(--success); 
            text-align: center; 
            margin-top: 12px; 
            font-weight: 600; 
            font-size: 14px;
        }
        
        .search-box { 
            display: flex; 
            gap: 10px; 
        }
        .search-box input { 
            flex: 1; 
        }
        .search-box button { 
            width: auto; 
            padding: 0 20px; 
        }
        
        .result-card { 
            margin-top: 18px; 
            padding: 18px; 
            border: 1.5px dashed var(--border-color); 
            border-radius: 12px; 
            background: #fafafa; 
            display: none; 
            text-align: center; 
        }
        .result-card img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 8px; 
            max-height: 200px; 
            object-fit: contain; 
            margin-bottom: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .product-details { 
            text-align: left; 
            margin-bottom: 15px; 
            line-height: 1.6; 
            font-size: 14px;
        }
        
        /* Quotation / Print Table */
        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0; 
            margin-top: 15px; 
            font-size: 14px; 
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        th, td { 
            padding: 12px 14px; 
            text-align: left; 
            border-bottom: 1px solid var(--border-color); 
        }
        th { 
            background-color: #f1f5f9; 
            color: var(--text-muted);
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .cart-img { 
            width: 44px; 
            height: 44px; 
            object-fit: cover; 
            border-radius: 6px; 
            border: 1px solid var(--border-color);
        }
        
        .total-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed var(--border-color);
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
        }

        /* Print Layout Rules */
        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .container { box-shadow: none; border: none; max-width: 100%; padding: 0; margin: 0; }
            table { border: 1px solid #000; }
            th, td { border: 1px solid #000; padding: 8px; }
            th { background-color: #eee !important; color: #000; -webkit-print-color-adjust: exact; }
            .btn-danger { display: none; }
        }
    </style>
</head>
<body>

<!-- Section 1: Product Entry Form -->
<div class="container no-print">
    <h2>📦 1. Product Entry Form</h2>
    <form id="productForm">
        <div class="form-group">
            <label>Item Number (Unique ID)</label>
            <input type="text" id="itemNumber" required placeholder="Jaise: ITM-001">
        </div>
        <div class="form-group">
            <label>Product Photo (Image)</label>
            <input type="file" id="productPhoto" accept="image/*" required>
        </div>
        <div class="form-group">
            <label>Description / Name</label>
            <textarea id="productDesc" rows="2" required placeholder="Product ki details yahan likhein"></textarea>
        </div>
        <div class="form-group">
            <label>Size</label>
            <input type="text" id="productSize" required placeholder="Jaise: Medium / 30x30">
        </div>
        <div class="form-group">
            <label>Price (₹)</label>
            <input type="number" id="productPrice" required placeholder="Price daaliye">
        </div>
        <button type="submit">Save Product</button>
    </form>
    <div id="msg" class="success-msg"></div>
</div>

<!-- Section 2: Search Product -->
<div class="container no-print">
    <h2>🔍 2. Search Product</h2>
    <div class="form-group search-box" style="margin-bottom:0;">
        <input type="text" id="searchItemNo" placeholder="Item Number daaliye (jaise: ITM-001)">
        <button type="button" onclick="searchProduct()">Search</button>
    </div>
    
    <div id="searchResult" class="result-card">
        <img id="resPhoto" src="" alt="Product Photo">
        <div class="product-details">
            <p><strong>Item Number:</strong> <span id="resItemNo"></span></p>
            <p><strong>Description:</strong> <span id="resDesc"></span></p>
            <p><strong>Size:</strong> <span id="resSize"></span></p>
            <p><strong>Price:</strong> ₹<span id="resPrice"></span></p>
        </div>
        <button class="btn-add" onclick="addToQuotation()">+ Add to Selected List</button>
    </div>
</div>

<!-- Section 3: Selected Products / Quotation Sheet -->
<div class="container" id="printArea">
    <h2>📄 Selected Products & Quotation</h2>
    <table id="cartTable">
        <thead>
            <tr>
                <th>Photo</th>
                <th>Item No</th>
                <th>Desc</th>
                <th>Size</th>
                <th>Price</th>
                <th class="no-print">Action</th>
            </tr>
        </thead>
        <tbody id="cartBody">
            <tr>
                <td colspan="6" style="text-align:center; color:var(--text-muted); padding: 20px;">Koi product select nahi kiya gaya hai.</td>
            </tr>
        </tbody>
    </table>
    
    <div class="total-section">
        <span>Total Amount:</span>
        <span>₹<span id="totalPrice">0</span></span>
    </div>

    <button class="btn-print no-print" onclick="window.print()">🖨️ Print / Save as PDF</button>
</div>

<script>
    let currentSearchedProduct = null;
    let quotationCart = [];

    document.getElementById('productForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const itemNumber = document.getElementById('itemNumber').value.trim();
        const photoInput = document.getElementById('productPhoto');
        const productDesc = document.getElementById('productDesc').value;
        const productSize = document.getElementById('productSize').value;
        const productPrice = document.getElementById('productPrice').value;

        if (photoInput.files && photoInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    let width = img.width;
                    let height = img.height;
                    const max_size = 500;
                    if (width > height) {
                        if (width > max_size) { height *= max_size / width; width = max_size; }
                    } else {
                        if (height > max_size) { width *= max_size / height; height = max_size; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                    const productData = {
                        itemNumber: itemNumber,
                        photo: compressedBase64,
                        description: productDesc,
                        size: productSize,
                        price: productPrice
                    };

                    let products = JSON.parse(localStorage.getItem('businessProducts')) || [];
                    let existingIndex = products.findIndex(p => p.itemNumber.toLowerCase() === itemNumber.toLowerCase());
                    
                    if(existingIndex > -1) {
                        products[existingIndex] = productData;
                    } else {
                        products.push(productData);
                    }

                    try {
                        localStorage.setItem('businessProducts', JSON.stringify(products));
                        document.getElementById('msg').innerText = "✨ Product Successfully Save Ho Gaya!";
                        document.getElementById('productForm').reset();
                    } catch (err) {
                        alert("Storage full ho gayi hai!");
                    }

                    setTimeout(() => { document.getElementById('msg').innerText = ""; }, 3000);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(photoInput.files[0]);
        }
    });

    function searchProduct() {
        const query = document.getElementById('searchItemNo').value.trim();
        const resultDiv = document.getElementById('searchResult');

        if(!query) {
            alert("Kripya Item Number daaliye!");
            return;
        }

        let products = JSON.parse(localStorage.getItem('businessProducts')) || [];
        const found = products.find(p => p.itemNumber.toLowerCase() === query.toLowerCase());

        if(found) {
            currentSearchedProduct = found;
            resultDiv.style.display = "block";
            document.getElementById('resPhoto').src = found.photo;
            document.getElementById('resItemNo').innerText = found.itemNumber;
            document.getElementById('resDesc').innerText = found.description;
            document.getElementById('resSize').innerText = found.size;
            document.getElementById('resPrice').innerText = found.price;
        } else {
            resultDiv.style.display = "none";
            currentSearchedProduct = null;
            alert("Yeh Item Number nahi mila!");
        }
    }

    function addToQuotation() {
        if(!currentSearchedProduct) return;
        quotationCart.push(currentSearchedProduct);
        renderCart();
        alert("✔️ Product quotation list mein add ho gaya!");
    }

    function renderCart() {
        const tbody = document.getElementById('cartBody');
        tbody.innerHTML = "";

        if(quotationCart.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-muted); padding: 20px;">Koi product select nahi kiya gaya hai.</td></tr>`;
            document.getElementById('totalPrice').innerText = "0";
            return;
        }

        let total = 0;
        quotationCart.forEach((item, index) => {
            total += Number(item.price);
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><img src="${item.photo}" class="cart-img"></td>
                <td><strong>${item.itemNumber}</strong></td>
                <td>${item.description}</td>
                <td>${item.size}</td>
                <td>₹${item.price}</td>
                <td class="no-print"><button class="btn-danger" onclick="removeFromCart(${index})">Remove</button></td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('totalPrice').innerText = total;
    }

    function removeFromCart(index) {
        quotationCart.splice(index, 1);
        renderCart();
    }
</script>

</body>
</html>
